apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: crossplane-resources
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PINJALA780/crossplane-resources.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
