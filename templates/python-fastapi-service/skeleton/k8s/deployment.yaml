apiVersion: apps/v1
kind: Deployment

metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
  labels:
    app: ${{ values.name }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ${{ values.name }}

  template:
    metadata:
      labels:
        app: ${{ values.name }}

    spec:
      containers:
        - name: ${{ values.name }}

          image: docker.io/venkatesh2007567/${{ values.name }}:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: ${{ values.name }}-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
